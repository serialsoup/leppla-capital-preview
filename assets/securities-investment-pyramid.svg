<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Securities Investment Pyramid</title>
  <desc id="desc">A securities investment pyramid with Market Beta and Fixed Income as the foundation, followed by Asset Class, Sector ETFs, Thematic, and Direct investments.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071b31"/>
      <stop offset="1" stop-color="#0b3a64"/>
    </linearGradient>
    <linearGradient id="base" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f6f5"/>
      <stop offset="1" stop-color="#d5d9dc"/>
    </linearGradient>
    <linearGradient id="alpha" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef1f3"/>
      <stop offset="1" stop-color="#cbd2d7"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e3b34e"/>
      <stop offset="1" stop-color="#b97813"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#00101f" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="620" cy="340" r="280" fill="#c88b21" opacity=".1"/>
  <circle cx="240" cy="760" r="260" fill="#ffffff" opacity=".045"/>
  <g font-family="Inter, Arial, sans-serif" font-weight="800" letter-spacing="4" text-transform="uppercase">
    <text x="600" y="94" text-anchor="middle" fill="#c88b21" font-size="24">Risk tolerance determines the percentages</text>
  </g>
  <g filter="url(#shadow)" font-family="Georgia, 'Times New Roman', serif" font-weight="700" text-anchor="middle">
    <polygon points="560,134 640,134 688,214 512,214" fill="url(#cap)" stroke="#fff" stroke-width="5"/>
    <text x="600" y="184" fill="#fff" font-size="28">Direct</text>
    <polygon points="512,236 688,236 756,338 444,338" fill="url(#alpha)" stroke="#fff" stroke-width="5"/>
    <text x="600" y="300" fill="#082d52" font-size="30">Thematic</text>
    <polygon points="430,360 770,360 856,492 344,492" fill="url(#alpha)" stroke="#fff" stroke-width="5"/>
    <text x="600" y="438" fill="#082d52" font-size="32">Sector ETFs</text>
    <polygon points="330,514 870,514 976,646 224,646" fill="url(#alpha)" stroke="#fff" stroke-width="5"/>
    <text x="600" y="592" fill="#082d52" font-size="34">Asset Class</text>
    <text x="600" y="676" fill="#cbd6df" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="2">Alpha</text>
    <polygon points="188,704 1012,704 1120,812 80,812" fill="url(#base)" stroke="#fff" stroke-width="5"/>
    <text x="600" y="770" fill="#082d52" font-size="36">Fixed Income</text>
    <polygon points="96,842 1104,842 1180,894 20,894" fill="url(#base)" stroke="#fff" stroke-width="5"/>
    <text x="600" y="882" fill="#082d52" font-size="34">Market Beta</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" fill="#ffffff" font-size="22" font-weight="700">
    <path d="M1130 802V198" stroke="#c88b21" stroke-width="6" stroke-linecap="round"/>
    <path d="M1130 198l-22 34M1130 198l22 34" stroke="#c88b21" stroke-width="6" stroke-linecap="round"/>
    <text x="1154" y="500" transform="rotate(-90 1154 500)" text-anchor="middle" fill="#cbd6df">Increasing risk and return potential</text>
  </g>
</svg>
