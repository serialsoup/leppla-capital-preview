<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Fixed-Fee vs. Variable-Fee Returns</title>
  <desc id="desc">An illustrative 20-year growth chart showing a fixed-fee return line above a variable-fee return line.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f5f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#082d52" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="#f6f5f0"/>
  <circle cx="1015" cy="145" r="310" fill="#e9d9b9" opacity=".26"/>
  <circle cx="170" cy="710" r="260" fill="#d6e0e6" opacity=".32"/>
  <g filter="url(#shadow)">
    <rect x="68" y="54" width="1064" height="638" rx="10" fill="url(#paper)" stroke="#d8dde1" stroke-width="3"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-weight="800">
    <text x="600" y="112" text-anchor="middle" fill="#5a5a5a" font-size="42">Fixed-Fee vs. Variable-Fee Returns</text>
  </g>
  <g transform="translate(160 164)" font-family="Inter, Arial, sans-serif">
    <path d="M0 430H890" stroke="#8ea0ad" stroke-width="3"/>
    <path d="M0 430V20" stroke="#8ea0ad" stroke-width="3"/>
    <path d="M0 355H890M0 280H890M0 205H890M0 130H890M0 55H890" stroke="#d9e0e5" stroke-width="2"/>
    <g fill="#5f6870" font-size="20">
      <text x="-24" y="60" text-anchor="end">16,000,000</text>
      <text x="-24" y="135" text-anchor="end">14,000,000</text>
      <text x="-24" y="210" text-anchor="end">12,000,000</text>
      <text x="-24" y="285" text-anchor="end">8,000,000</text>
      <text x="-24" y="360" text-anchor="end">4,000,000</text>
      <text x="-24" y="434" text-anchor="end">-</text>
    </g>
    <path d="M28 400 C96 394 138 384 185 371 S280 345 328 323 S425 277 472 243 S568 176 616 133 S713 50 782 18" fill="none" stroke="#0d5f7d" stroke-width="9" stroke-linecap="round"/>
    <path d="M28 401 C96 395 138 386 185 374 S280 352 328 332 S425 292 472 262 S568 205 616 168 S713 94 782 60" fill="none" stroke="#f06b2a" stroke-width="9" stroke-linecap="round"/>
    <g fill="#5f6870" font-size="18">
      <text x="28" y="466" text-anchor="middle">0</text>
      <text x="70" y="466" text-anchor="middle">1</text>
      <text x="112" y="466" text-anchor="middle">2</text>
      <text x="154" y="466" text-anchor="middle">3</text>
      <text x="196" y="466" text-anchor="middle">4</text>
      <text x="238" y="466" text-anchor="middle">5</text>
      <text x="280" y="466" text-anchor="middle">6</text>
      <text x="322" y="466" text-anchor="middle">7</text>
      <text x="364" y="466" text-anchor="middle">8</text>
      <text x="406" y="466" text-anchor="middle">9</text>
      <text x="448" y="466" text-anchor="middle">10</text>
      <text x="490" y="466" text-anchor="middle">11</text>
      <text x="532" y="466" text-anchor="middle">12</text>
      <text x="574" y="466" text-anchor="middle">13</text>
      <text x="616" y="466" text-anchor="middle">14</text>
      <text x="658" y="466" text-anchor="middle">15</text>
      <text x="700" y="466" text-anchor="middle">16</text>
      <text x="742" y="466" text-anchor="middle">17</text>
      <text x="784" y="466" text-anchor="middle">18</text>
      <text x="826" y="466" text-anchor="middle">19</text>
      <text x="868" y="466" text-anchor="middle">20</text>
    </g>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="22" fill="#5a5a5a">
    <rect x="410" y="646" width="72" height="8" rx="4" fill="#0d5f7d"/>
    <text x="488" y="658">Fixed-Fee</text>
    <rect x="600" y="646" width="72" height="8" rx="4" fill="#f06b2a"/>
    <text x="678" y="658">Variable-Fee (1.5%)</text>
  </g>
</svg>
